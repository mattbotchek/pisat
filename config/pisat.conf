# Alfa AWUS036ACH adapters are commonly exposed as wlan1.
interface=wlan1

# LoRa is the primary data and control surface. The SX126x HAT must already be
# configured for transparent UART mode with matching radio parameters.
lora_enabled=true
lora_device=/dev/serial0
lora_baud=9600
lora_node_id=replace-with-unique-node-id
lora_key=replace-with-a-random-32-byte-key
lora_allowed_controllers=replace-with-authorized-pitak-id
lora_m0_gpio=22
lora_m1_gpio=27
lora_aux_gpio=17
lora_aux_active_high=true
lora_aux_timeout_ms=2000
lora_publish_interval_seconds=30
lora_max_frame_bytes=220

# Optional local/LAN diagnostics API.
http_enabled=false
bind_address=127.0.0.1
port=8080
api_token=

data_directory=/var/lib/pisat
default_engine=tcpdump
default_channel=0
device_ttl_seconds=300
